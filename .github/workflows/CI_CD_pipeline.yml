# Name of Workflow
name: Deploy app

# Control trigger for workflow
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EB_ENVIRONMENT_NAME: cds-flask-app-env-3
  EB_APPLICATION_NAME: loan-business-glossary-app
  EB_DEPLOY_PACKAGE: deploy.zip
  TERRAFORM_VERSION: 1.5.0
  DB_HOST: database-1.cvhifpi70v8r.us-east-1.rds.amazonaws.com
  DB_USER: ${{ secrets.DB_USER }}
  DB_NAME: Cloud_DevOPsSec
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch code
        uses: actions/checkout@v3

      - name: Install Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install black
        run: pip install black
      - name: Change working directory
        run: cd ./website
      - name: Lint code
        run: black .
        working-directory: ./website

  IAC:
    needs: CI  
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 

    steps:
      - name: Fetch code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
       
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
       
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init
     
      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate
      
      - name: Check if application exists
        id: check_app
        run: |
          APP_EXISTS=$(aws elasticbeanstalk describe-applications --application-names ${{ env.EB_APPLICATION_NAME }} 2>/dev/null | jq -r '.Applications | length > 0')
          echo "exists=$APP_EXISTS" >> $GITHUB_OUTPUT

      - name: Check if environment exists 
        id: check_env
        run: |
          EXISTS=$(aws elasticbeanstalk describe-environments --environment-names ${{ env.EB_ENVIRONMENT_NAME }} | jq -r '.Environments | length > 0')
          echo "exists=$EXISTS" >> $GITHUB_OUTPUT
       
      - name: Terraform Plan
        working-directory: ./terraform
        if: steps.check_env.outputs.exists == 'false'
        run: |
          terraform plan \
            -var="db_host=${{ env.DB_HOST }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_name=${{ env.DB_NAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="admin_password=${{ secrets.ADMIN_PASSWORD }}" \
            -out tfplan
         
      - name: Terraform Apply
        working-directory: ./terraform
        if: steps.check_app.outputs.exists == 'false' || steps.check_env.outputs.exists == 'false'
        run: terraform apply -auto-approve tfplan

  CD:
    needs: IAC  
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 

    steps:
      - name: Fetch code
        uses: actions/checkout@v3

      - name: setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
     
      - name: Generate deployment package
        run: zip -r ${{ env.EB_DEPLOY_PACKAGE }} . -x "*.git*" "*.github*" "terraform/*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ env.AWS_REGION }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: ${{ github.sha }}
          deployment_package: ${{ env.EB_DEPLOY_PACKAGE }}